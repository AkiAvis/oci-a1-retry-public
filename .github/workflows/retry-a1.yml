name: Retry OCI A1 capacity

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: oci-a1-capacity-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OCI_CORE_STACK_ID: ${{ vars.OCI_CORE_STACK_ID }}
      OCI_SMALL_01_STACK_ID: ${{ vars.OCI_SMALL_01_STACK_ID }}
      OCI_SMALL_02_STACK_ID: ${{ vars.OCI_SMALL_02_STACK_ID }}
      OCI_A1_COMPARTMENT_ID: ${{ vars.OCI_A1_COMPARTMENT_ID }}
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
      OCI_PRIVATE_KEY_B64: ${{ secrets.OCI_PRIVATE_KEY_B64 }}
      CREATE_JOB_MAX_ATTEMPTS: "1"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate configuration and secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in OCI_CORE_STACK_ID OCI_SMALL_01_STACK_ID OCI_SMALL_02_STACK_ID OCI_A1_COMPARTMENT_ID OCI_CLI_USER OCI_CLI_TENANCY OCI_CLI_FINGERPRINT OCI_CLI_REGION OCI_PRIVATE_KEY_B64; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing GitHub secret: $name" >&2
              exit 1
            fi
          done

      - name: Install OCI CLI and Python SDK
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet "oci==2.181.1" "oci-cli==3.89.1"
          python -c 'import oci; print("OCI Python SDK import: ok")'

      - name: Configure OCI CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.oci"
          chmod 700 "$HOME/.oci"
          printf '%s' "$OCI_PRIVATE_KEY_B64" | base64 --decode > "$HOME/.oci/a1-retry-key.pem"
          chmod 600 "$HOME/.oci/a1-retry-key.pem"
          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$OCI_CLI_USER
          fingerprint=$OCI_CLI_FINGERPRINT
          tenancy=$OCI_CLI_TENANCY
          region=$OCI_CLI_REGION
          key_file=$HOME/.oci/a1-retry-key.pem
          EOF
          chmod 600 "$HOME/.oci/config"

      - name: Orchestrate A1 retries
        shell: bash
        run: scripts/orchestrate-a1.sh

      - name: Notify once when the A1 target is acquired
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          instances="$(python scripts/list-a1-instances.py "$OCI_A1_COMPARTMENT_ID")"
          jq -e '.data | type == "array"' >/dev/null <<<"$instances"

          classification="$(jq -c \
            --arg core "hermes-core-01" \
            --arg small01 "hermes-a1-small-01" \
            --arg small02 "hermes-a1-small-02" '
            def cfg: .["shape-config"];
            [ .data[] ] as $a1 |
            {
              core:    [ $a1[] | select(.["display-name"] == $core and (cfg.ocpus | tonumber) == 2 and (cfg."memory-in-gbs" | tonumber) == 12) ],
              small01: [ $a1[] | select(.["display-name"] == $small01 and (cfg.ocpus | tonumber) == 1 and (cfg."memory-in-gbs" | tonumber) == 6) ],
              small02: [ $a1[] | select(.["display-name"] == $small02 and (cfg.ocpus | tonumber) == 1 and (cfg."memory-in-gbs" | tonumber) == 6) ],
              total: $a1
            } |
            . + {expected: (.core + .small01 + .small02 | length)}
          ' <<<"$instances")"

          total="$(jq -r '.total | length' <<<"$classification")"
          expected="$(jq -r '.expected' <<<"$classification")"
          if [[ "$total" != "$expected" ]]; then
            echo "Unexpected A1 instance detected; skipping acquisition notification."
            exit 0
          fi

          core_count="$(jq -r '.core | length' <<<"$classification")"
          small01_count="$(jq -r '.small01 | length' <<<"$classification")"
          small02_count="$(jq -r '.small02 | length' <<<"$classification")"

          if [[ "$core_count" != 1 && ! ( "$small01_count" == 1 && "$small02_count" == 1 ) ]]; then
            echo "Always Free A1 target is not fully satisfied yet; no notification."
            exit 0
          fi

          title='🎉 OCI A1無料枠の取得に成功しました'
          search_response="$(curl -fsS --get \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-urlencode "q=repo:$GITHUB_REPOSITORY is:issue in:title \"$title\"" \
            https://api.github.com/search/issues)"

          if jq -e --arg title "$title" '.items[]? | select(.title == $title)' >/dev/null <<<"$search_response"; then
            echo "Acquisition notification issue already exists; no duplicate created."
            exit 0
          fi

          body=$(cat <<'EOF'
          @AkiAvis

          Oracle Cloud Singapore で Always Free A1 の目標構成（合計 2 OCPU / 12 GB）の取得を確認しました。🎉

          - `hermes-core-01`（2 OCPU / 12 GB）、または
          - `hermes-a1-small-01` + `hermes-a1-small-02`（各 1 OCPU / 6 GB）

          のいずれかが揃っています。

          **Cloudflare の `oci-a1-retry-trigger` Cron を停止してください。**
          EOF
          )

          payload="$(jq -n --arg title "$title" --arg body "$body" '{title:$title,body:$body}')"
          created="$(curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/"$GITHUB_REPOSITORY"/issues \
            -d "$payload")"

          echo "Created acquisition notification issue: $(jq -r '.html_url' <<<"$created")"
