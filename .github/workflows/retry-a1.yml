name: Retry OCI A1 capacity

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oci-a1-capacity-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OCI_CORE_STACK_ID: ${{ vars.OCI_CORE_STACK_ID }}
      OCI_SMALL_01_STACK_ID: ${{ vars.OCI_SMALL_01_STACK_ID }}
      OCI_SMALL_02_STACK_ID: ${{ vars.OCI_SMALL_02_STACK_ID }}
      OCI_A1_COMPARTMENT_ID: ${{ vars.OCI_A1_COMPARTMENT_ID }}
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
      OCI_PRIVATE_KEY_B64: ${{ secrets.OCI_PRIVATE_KEY_B64 }}
      CREATE_JOB_MAX_ATTEMPTS: "1"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate configuration and secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in OCI_CORE_STACK_ID OCI_SMALL_01_STACK_ID OCI_SMALL_02_STACK_ID OCI_A1_COMPARTMENT_ID OCI_CLI_USER OCI_CLI_TENANCY OCI_CLI_FINGERPRINT OCI_CLI_REGION OCI_PRIVATE_KEY_B64; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing GitHub secret: $name" >&2
              exit 1
            fi
          done

      - name: Install OCI CLI and Python SDK
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet "oci==2.181.1" "oci-cli==3.89.1"
          python -c 'import oci; print("OCI Python SDK import: ok")'

      - name: Configure OCI CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.oci"
          chmod 700 "$HOME/.oci"
          printf '%s' "$OCI_PRIVATE_KEY_B64" | base64 --decode > "$HOME/.oci/a1-retry-key.pem"
          chmod 600 "$HOME/.oci/a1-retry-key.pem"
          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$OCI_CLI_USER
          fingerprint=$OCI_CLI_FINGERPRINT
          tenancy=$OCI_CLI_TENANCY
          region=$OCI_CLI_REGION
          key_file=$HOME/.oci/a1-retry-key.pem
          EOF
          chmod 600 "$HOME/.oci/config"

      - name: Orchestrate A1 retries
        shell: bash
        run: scripts/orchestrate-a1.sh
